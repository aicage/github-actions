name: "Test-Build Workflow for: Build Multi-Arch Image With Signature and Provenance"

"on":
  push:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REPOSITORY: aicage/test-multiarch-image-build-sign-provenance
  VERSION_TAG: version-${{ github.sha }}
  PURPOSE_TAG: latest
  DOCKERFILE: tests/build/Dockerfile
  BUILD_CONTEXT: tests/build/

jobs:
  set-globals:
    name: Set global vars
    runs-on: ubuntu-latest
    outputs:
      IMAGE_REF: ${{ steps.output-vars.outputs.IMAGE_REF }}
      UNIQUE: ${{ steps.output-vars.outputs.UNIQUE }}
      VERSION_TAG: ${{ steps.output-vars.outputs.VERSION_TAG }}
      PURPOSE_TAG: ${{ steps.output-vars.outputs.PURPOSE_TAG }}
    steps:
      - name: Output global vars
        id: output-vars
        run: |
          set -euo pipefail
          {
            echo "IMAGE_REF=${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}"
            echo "UNIQUE=${{ github.sha }}-$(uuidgen)"
            echo "VERSION_TAG=${VERSION_TAG}"
            echo "PURPOSE_TAG=${PURPOSE_TAG}"
          } | tee /dev/stderr >> "$GITHUB_OUTPUT"

  build:
    name: Build and sign image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: set-globals
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH_SUFFIX: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      UNIQUE: ${{ needs.set-globals.outputs.UNIQUE }}
    outputs:
      INDEX_DIGEST_amd64: ${{ steps.out-amd64.outputs.INDEX_DIGEST }}
      INDEX_DIGEST_arm64: ${{ steps.out-arm64.outputs.INDEX_DIGEST }}

    steps:
      - name: Write image tags to env
        run: |
          set -euo pipefail
          {
            echo "IMAGE_TEST_TAG=${IMAGE_REF}:${UNIQUE}-${{ matrix.arch }}-test"
          } | tee /dev/stderr >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.11.1
        with:
          driver: docker-container

      - name: Log in to Docker Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          provenance: true
          platforms: ${{ env.PLATFORM }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ env.UNIQUE }}-${{ matrix.arch }}-test

      - name: Test image
        run: |
          set -euo pipefail
          docker run --rm \
            ${{ env.IMAGE_REF }}@${{ steps.build_image.outputs.digest }} \
            sh -ec '
              set -eu
              echo "Debug: cat /test.txt"
              cat /test.txt
              grep -q "test-date:" /test.txt
            '

      - name: Export digest (amd64)
        id: out-amd64
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          (
            echo "INDEX_DIGEST=${{ steps.build_image.outputs.digest }}"
          ) | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Export digest (arm64)
        id: out-arm64
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          (
            echo "INDEX_DIGEST=${{ steps.build_image.outputs.digest }}"
          ) | tee /dev/stderr >> "$GITHUB_OUTPUT"

  multiarch:
    name: Run multi-arch sign/provenance/publish
    needs: [set-globals, build]
    uses: ./.github/workflows/multiarch-image-build-sign-provenance.yml
    with:
      image_ref: ${{ needs.set-globals.outputs.IMAGE_REF }}
      version_tag: ${{ needs.set-globals.outputs.VERSION_TAG }}
      purpose_tag: ${{ needs.set-globals.outputs.PURPOSE_TAG }}
      index_digest_amd64: ${{ needs.build.outputs.INDEX_DIGEST_amd64 }}
      index_digest_arm64: ${{ needs.build.outputs.INDEX_DIGEST_arm64 }}
    secrets: inherit
