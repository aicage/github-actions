name: Build Multi-Arch Image With Signature and Provenance SLSA

"on":
  workflow_call:
    inputs:
      image_ref:
        description: Full image reference (registry/repo).
        required: true
        type: string
      version_tag:
        description: Version tag to publish.
        required: true
        type: string
      purpose_tag:
        description: Purpose tag to publish.
        required: true
        type: string
      index_digest_amd64:
        description: Index digest for amd64 build.
        required: true
        type: string
      index_digest_arm64:
        description: Index digest for arm64 build.
        required: true
        type: string
      actions_ref:
        description: The version of github-actions
        type: string
        required: true

jobs:

  image-platform-digests:
    name: Read image platform digests
    runs-on: ubuntu-latest
    outputs:
      platform_digest_amd64: ${{ steps.platform-digest-amd64.outputs.digest }}
      platform_digest_arm64: ${{ steps.platform-digest-arm64.outputs.digest }}

    steps:

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: aicage/github-actions
          ref: ${{ inputs.actions_ref }}
          path: .github-actions

      - name: Read image platform digest (amd64)
        id: platform-digest-amd64
        uses: ./.github-actions/.github/actions/image-read-platform-digest
        with:
          image: ${{ inputs.image_ref }}@${{ inputs.index_digest_amd64 }}
          architecture: amd64

      - name: Read image platform digest (arm64)
        id: platform-digest-arm64
        uses: ./.github-actions/.github/actions/image-read-platform-digest
        with:
          image: ${{ inputs.image_ref }}@${{ inputs.index_digest_arm64 }}
          architecture: arm64

  image-slsa-provenance-index_digest:
    name: SLSA provenance index-digest (${{ matrix.arch }})
    # slsa-framework/slsa-github-generator must be pinned by tag, see section 'Referencing SLSA builders and generators'
    # on https://github.com/slsa-framework/slsa-github-generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    strategy:
      matrix:
        include:
          - arch: amd64
            index_digest: ${{ inputs.index_digest_amd64 }}
          - arch: arm64
            index_digest: ${{ inputs.index_digest_arm64 }}
    with:
      image: ${{ inputs.image_ref }}
      digest: ${{ matrix.index_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}


  image-slsa-provenance-platform_digest:
    name: SLSA provenance index-digest (${{ matrix.arch }})
    needs: [image-platform-digests]
    # slsa-framework/slsa-github-generator must be pinned by tag, see section 'Referencing SLSA builders and generators'
    # on https://github.com/slsa-framework/slsa-github-generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    strategy:
      matrix:
        include:
          - arch: amd64
            platform_digest: ${{ needs.image-platform-digests.outputs.platform_digest_amd64 }}
          - arch: arm64
            platform_digest: ${{ needs.image-platform-digests.outputs.platform_digest_arm64 }}
    with:
      image: ${{ inputs.image_ref }}
      digest: ${{ matrix.platform_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-publish:
    name: Verify and publish
    needs: [
      image-platform-digests,
      image-slsa-provenance-index_digest,
      image-slsa-provenance-platform_digest
    ]
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: aicage/github-actions
          ref: ${{ inputs.actions_ref }}
          path: .github-actions

      - name: Log in to Docker Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22  # v4.1.0

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6  # v2.7.1

      - name: Install regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc  # v0.1.0

      - name: Verify and attest image (amd64)
        uses: ./.github-actions/.github/actions/image-cosign-verify
        with:
          image_ref: ${{ inputs.image_ref }}
          index_digest: ${{ inputs.index_digest_amd64 }}
          platform_digest: ${{ needs.image-platform-digests.outputs.platform_digest_amd64 }}

      - name: Verify and attest image (arm64)
        uses: ./.github-actions/.github/actions/image-cosign-verify
        with:
          image_ref: ${{ inputs.image_ref }}
          index_digest: ${{ inputs.index_digest_arm64 }}
          platform_digest: ${{ needs.image-platform-digests.outputs.platform_digest_arm64 }}

      - name: Verify SLSA provenance (amd64)
        uses: ./.github-actions/.github/actions/image-cosign-verify-SLSA
        with:
          image_ref: ${{ inputs.image_ref }}
          index_digest: ${{ inputs.index_digest_amd64 }}
          platform_digest: ${{ needs.image-platform-digests.outputs.platform_digest_amd64 }}

      - name: Verify SLSA provenance (arm64)
        uses: ./.github-actions/.github/actions/image-cosign-verify-SLSA
        with:
          image_ref: ${{ inputs.image_ref }}
          index_digest: ${{ inputs.index_digest_arm64 }}
          platform_digest: ${{ needs.image-platform-digests.outputs.platform_digest_arm64 }}

      - name: Publish architecture-specific tags (amd64)
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ inputs.image_ref }}:${{ inputs.version_tag }}-amd64" \
            --tag "${{ inputs.image_ref }}:${{ inputs.purpose_tag }}-amd64" \
            "${{ inputs.image_ref }}@${{ inputs.index_digest_amd64 }}"

      - name: Publish architecture-specific tags (arm64)
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ inputs.image_ref }}:${{ inputs.version_tag }}-arm64" \
            --tag "${{ inputs.image_ref }}:${{ inputs.purpose_tag }}-arm64" \
            "${{ inputs.image_ref }}@${{ inputs.index_digest_arm64 }}"

      - name: Publish multi-arch manifest by digest
        id: publish-manifest
        uses: ./.github-actions/.github/actions/manifest-publish-digest
        with:
          image_ref: ${{ inputs.image_ref }}
          index_digest_amd64: ${{ inputs.index_digest_amd64 }}
          index_digest_arm64: ${{ inputs.index_digest_arm64 }}

      - name: Sign multi-arch manifest digest
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${{ inputs.image_ref }}@${{ steps.publish-manifest.outputs.digest }}"

      - name: Verify multi-arch manifest signature
        uses: ./.github-actions/.github/actions/cosign-verify
        with:
          image: ${{ inputs.image_ref }}@${{ steps.publish-manifest.outputs.digest }}

      - name: Publish final multi-arch manifest tags
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ inputs.image_ref }}:${{ inputs.version_tag }}" \
            --tag "${{ inputs.image_ref }}:${{ inputs.purpose_tag }}" \
            "${{ inputs.image_ref }}@${{ steps.publish-manifest.outputs.digest }}"
