name: Build Multi-Arch Image With Signature and Provenance

"on":
  workflow_call:
    inputs:
      image_ref:
        description: Full image reference (registry/repo).
        required: true
        type: string
      unique:
        description: Unique tag suffix for test images.
        required: true
        type: string
      version_tag:
        description: Version tag to publish.
        required: true
        type: string
      purpose_tag:
        description: Purpose tag to publish.
        required: true
        type: string
      index_digest_amd64:
        description: Index digest for amd64 build.
        required: true
        type: string
      index_digest_arm64:
        description: Index digest for arm64 build.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

env:
  IMAGE_REF: ${{ inputs.image_ref }}
  UNIQUE: ${{ inputs.unique }}
  VERSION_TAG: ${{ inputs.version_tag }}
  PURPOSE_TAG: ${{ inputs.purpose_tag }}

jobs:

  gather-digests:
    name: Write digests to variables
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            INDEX_DIGEST: ${{ inputs.index_digest_amd64 }}
          - arch: arm64
            INDEX_DIGEST: ${{ inputs.index_digest_arm64 }}
    outputs:
      PLATFORM_DIGEST_amd64: ${{ steps.out-amd64.outputs.PLATFORM_DIGEST }}
      PLATFORM_DIGEST_arm64: ${{ steps.out-arm64.outputs.PLATFORM_DIGEST }}
      ATTESTATION_DIGEST_amd64: ${{ steps.out-amd64.outputs.ATTESTATION_DIGEST }}
      ATTESTATION_DIGEST_arm64: ${{ steps.out-arm64.outputs.ATTESTATION_DIGEST }}

    steps:

      - name: Write digests to env
        run: |
          set -euo pipefail
          INDEX_DIGEST=${{ matrix.INDEX_DIGEST }}
          PLATFORM_DIGEST="$(docker buildx imagetools inspect --raw "${IMAGE_REF}@${INDEX_DIGEST}" \
            | jq -r '.manifests[]
              | select(.platform.os=="linux" and .platform.architecture=="${{ matrix.arch }}")
              | .digest' | head -n1)"
          ATTESTATION_DIGEST="$(docker buildx imagetools inspect --raw "${IMAGE_REF}@${INDEX_DIGEST}" \
            | jq -r '.manifests[]
              | select(.annotations."vnd.docker.reference.type"=="attestation-manifest")
              | .digest' | head -n1)"
          (
            echo "PLATFORM_DIGEST=${PLATFORM_DIGEST}"
            echo "ATTESTATION_DIGEST=${ATTESTATION_DIGEST}"
          ) | tee /dev/stderr >> "$GITHUB_ENV"

      - name: Export digest (amd64)
        id: out-amd64
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          (
            echo "PLATFORM_DIGEST=${PLATFORM_DIGEST}"
            echo "ATTESTATION_DIGEST=${ATTESTATION_DIGEST}"
          ) | tee /dev/stderr >> "$GITHUB_OUTPUT"

      - name: Export digest (arm64)
        id: out-arm64
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          (
            echo "PLATFORM_DIGEST=${PLATFORM_DIGEST}"
            echo "ATTESTATION_DIGEST=${ATTESTATION_DIGEST}"
          ) | tee /dev/stderr >> "$GITHUB_OUTPUT"

  slsa-provenance-INDEX_DIGEST:
    name: SLSA provenance index-digest (${{ matrix.arch }})
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    strategy:
      matrix:
        include:
          - arch: amd64
            INDEX_DIGEST: ${{ inputs.index_digest_amd64 }}
          - arch: arm64
            INDEX_DIGEST: ${{ inputs.index_digest_arm64 }}
    with:
      image: ${{ inputs.image_ref }}
      digest: ${{ matrix.INDEX_DIGEST }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}


  slsa-provenance-PLATFORM_DIGEST:
    name: SLSA provenance index-digest (${{ matrix.arch }})
    needs: [gather-digests]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    strategy:
      matrix:
        include:
          - arch: amd64
            PLATFORM_DIGEST: ${{ needs.gather-digests.outputs.PLATFORM_DIGEST_amd64 }}
          - arch: arm64
            PLATFORM_DIGEST: ${{ needs.gather-digests.outputs.PLATFORM_DIGEST_arm64 }}
    with:
      image: ${{ inputs.image_ref }}
      digest: ${{ matrix.PLATFORM_DIGEST }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  cosign-verify:
    name: Cosign signature and validations (${{ matrix.arch }})
    needs: [
      gather-digests,
      slsa-provenance-INDEX_DIGEST,
      slsa-provenance-PLATFORM_DIGEST
    ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            INDEX_DIGEST: ${{ inputs.index_digest_amd64 }}
            PLATFORM_DIGEST: ${{ needs.gather-digests.outputs.PLATFORM_DIGEST_amd64 }}
            ATTESTATION_DIGEST: ${{ needs.gather-digests.outputs.ATTESTATION_DIGEST_amd64 }}
          - arch: arm64
            INDEX_DIGEST: ${{ inputs.index_digest_arm64 }}
            PLATFORM_DIGEST: ${{ needs.gather-digests.outputs.PLATFORM_DIGEST_arm64 }}
            ATTESTATION_DIGEST: ${{ needs.gather-digests.outputs.ATTESTATION_DIGEST_arm64 }}

    steps:

      - name: Write image info to env
        run: |
          set -euo pipefail
          CERTIFICATE_IDENTITY_REGEXP="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/.*/.*$"
          {
            echo "INDEX_DIGEST=${{ matrix.INDEX_DIGEST }}"
            echo "PLATFORM_DIGEST=${{ matrix.PLATFORM_DIGEST }}"
            echo "ATTESTATION_DIGEST=${{ matrix.ATTESTATION_DIGEST }}"
            echo "CERTIFICATE_IDENTITY_REGEXP=${CERTIFICATE_IDENTITY_REGEXP}"
          } | tee /dev/stderr >> "$GITHUB_ENV"

      - name: Log in to Docker Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      # buildx often returns an OCI *index* digest even for single-arch builds.
      # Sign BOTH:
      #   1) the index digest (what the tag resolves to)
      #   2) the platform manifest digest (so `cosign verify IMAGE@PDIGEST` works)

      - name: Sign image index-digest with cosign
        id: sign-INDEX_DIGEST
        continue-on-error: true
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}@${INDEX_DIGEST}"

      - name: Sign image platform-digest with cosign
        id: sign-PLATFORM_DIGEST
        continue-on-error: true
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_REF}@${PLATFORM_DIGEST}"

      - name: Verify image index-digest signature
        id: verify-INDEX_DIGEST
        continue-on-error: true
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "${CERTIFICATE_IDENTITY_REGEXP}" \
            "${IMAGE_REF}@${INDEX_DIGEST}"

      - name: Verify platform-manifest-digest signature
        id: verify-PLATFORM_DIGEST
        continue-on-error: true
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "${CERTIFICATE_IDENTITY_REGEXP}" \
            "${IMAGE_REF}@${PLATFORM_DIGEST}"

      - name: Verify provenance is present (and pinned by the signed index)
        id: verify-ATTESTATION_DIGEST
        continue-on-error: true
        run: |
          set -euo pipefail
          # Must contain an in-toto layer declaring a SLSA provenance predicate-type.
          docker buildx imagetools inspect --raw "${IMAGE_REF}@${ATTESTATION_DIGEST}" \
            | jq -e '.layers[]?
              | .annotations."in-toto.io/predicate-type"
              | select(startswith("https://slsa.dev/provenance/"))'

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Verify SLSA provenance of index-digest
        id: verify-SLSA-INDEX_DIGEST
        continue-on-error: true
        run: |
          cosign download attestation \
            "${IMAGE_REF}@${INDEX_DIGEST}" \
            > provenance.intoto.jsonl
          slsa-verifier verify-image \
            --provenance-path provenance.intoto.jsonl \
            --source-uri github.com/${{ github.repository }} \
            "${IMAGE_REF}@${INDEX_DIGEST}"
          rm provenance.intoto.jsonl

      - name: Verify SLSA provenance of platform-digest
        id: verify-SLSA-PLATFORM_DIGEST
        continue-on-error: true
        run: |
          cosign download attestation \
            "${IMAGE_REF}@${PLATFORM_DIGEST}" \
            > provenance.intoto.jsonl
          slsa-verifier verify-image \
            --provenance-path provenance.intoto.jsonl \
            --source-uri github.com/${{ github.repository }} \
            "${IMAGE_REF}@${PLATFORM_DIGEST}"
          rm provenance.intoto.jsonl

      - name: Fail job if any step failed
        if: always()
        run: |
          if [ "${{ steps.sign-INDEX_DIGEST.outcome }}" = "failure" ] \
          || [ "${{ steps.sign-PLATFORM_DIGEST.outcome }}" = "failure" ] \
          || [ "${{ steps.verify-INDEX_DIGEST.outcome }}" = "failure" ] \
          || [ "${{ steps.verify-PLATFORM_DIGEST.outcome }}" = "failure" ] \
          || [ "${{ steps.verify-ATTESTATION_DIGEST.outcome }}" = "failure" ] \
          || [ "${{ steps.verify-SLSA-INDEX_DIGEST.outcome }}" = "failure" ] \
          || [ "${{ steps.verify-SLSA-PLATFORM_DIGEST.outcome }}" = "failure" ]; then

            echo "steps.sign-INDEX_DIGEST.outcome=${{ steps.sign-INDEX_DIGEST.outcome }}"
            echo "steps.sign-PLATFORM_DIGEST.outcome=${{ steps.sign-PLATFORM_DIGEST.outcome }}"
            echo "steps.verify-INDEX_DIGEST.outcome=${{ steps.verify-INDEX_DIGEST.outcome }}"
            echo "steps.verify-PLATFORM_DIGEST.outcome=${{ steps.verify-PLATFORM_DIGEST.outcome }}"
            echo "steps.verify-ATTESTATION_DIGEST.outcome=${{ steps.verify-ATTESTATION_DIGEST.outcome }}"
            echo "steps.verify-SLSA-INDEX_DIGEST.outcome=${{ steps.verify-SLSA-INDEX_DIGEST.outcome }}"
            echo "steps.verify-SLSA-PLATFORM_DIGEST.outcome=${{ steps.verify-SLSA-INDEX_DIGEST.outcome }}"

            exit 1
          fi

  publish-image:
    name: Publish image (${{ matrix.arch }})
    needs: [
      cosign-verify
    ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            INDEX_DIGEST: ${{ inputs.index_digest_amd64 }}
          - arch: arm64
            INDEX_DIGEST: ${{ inputs.index_digest_arm64 }}
    steps:

      - name: Write image tags to env
        run: |
          set -euo pipefail
          {
            echo "IMAGE_VERSION_TAG=${IMAGE_REF}:${VERSION_TAG}-${{ matrix.arch }}"
            echo "IMAGE_PURPOSE_TAG=${IMAGE_REF}:${PURPOSE_TAG}-${{ matrix.arch }}"
          } | tee /dev/stderr >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture-specific tags
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_VERSION_TAG}" \
            --tag "${IMAGE_PURPOSE_TAG}" \
            "${IMAGE_REF}@${{ matrix.INDEX_DIGEST }}"

  manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: [publish-image]
    env:
      INDEX_DIGEST_amd64: ${{ inputs.index_digest_amd64 }}
      INDEX_DIGEST_arm64: ${{ inputs.index_digest_arm64 }}

    steps:

      - name: Write manifest tags to env
        run: |
          set -euo pipefail
          {
            echo "MANIFEST_VERSION_TAG=${IMAGE_REF}:${VERSION_TAG}"
            echo "MANIFEST_PURPOSE_TAG=${IMAGE_REF}:${PURPOSE_TAG}"
          } | tee /dev/stderr >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.11.1
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install regctl
        uses:
          regclient/actions/regctl-installer@main

      - name: Publish test multi-arch manifest
        run: |
          set -euo pipefail
          # 1) generate the multi-arch index/manifest JSON (no push)
          # 2) push it *by digest* (no tag needed)
          MANIFEST_DIGEST="$(
            docker buildx imagetools create \
              --dry-run \
              "${INDEX_DIGEST_amd64}" \
              "${INDEX_DIGEST_arm64}" \
            | \
            regctl manifest put \
              --by-digest \
              "${IMAGE_REF}" \
              --format '{{.Digest}}'
          )"
          {
            echo "MANIFEST_DIGEST=${MANIFEST_DIGEST}"
          } | tee /dev/stderr >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign multi-arch manifest
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${IMAGE_REF}@${MANIFEST_DIGEST}"

      - name: Verify multi-arch manifest signature
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/.*/.*$" \
            "${IMAGE_REF}@${MANIFEST_DIGEST}"

      - name: Publish final multi-arch manifest tags
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${MANIFEST_VERSION_TAG}" \
            --tag "${MANIFEST_PURPOSE_TAG}" \
            "${IMAGE_REF}@${MANIFEST_DIGEST}"
