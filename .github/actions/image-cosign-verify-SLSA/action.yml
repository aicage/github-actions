name: Image Cosign Verify SLSA

description: Sign and verify image digests and validate SLSA provenance for a single arch.

inputs:
  image_ref:
    description: Image reference (registry/repo).
    required: true
  index_digest:
    description: Index digest for the image.
    required: true
  platform_digest:
    description: Platform manifest digest for the image.
    required: true
  certificate_identity_regexp:
    description: Expected certificate identity regexp.
    required: false
    default: "^https://github.com/aicage/github-actions/.github/workflows/.*@refs/.*/.*$"

runs:
  using: composite
  steps:

    - name: Verify SLSA provenance of index-digest
      shell: bash
      run: |
        cosign download attestation \
          "${{ inputs.image_ref }}@${{ inputs.index_digest }}" \
          > provenance.intoto.jsonl
        slsa-verifier verify-image \
          --provenance-path provenance.intoto.jsonl \
          --source-uri "github.com/${{ github.repository }}" \
          "${{ inputs.image_ref }}@${{ inputs.index_digest }}"
        rm provenance.intoto.jsonl

    - name: Verify SLSA provenance of platform-digest
      shell: bash
      run: |
        cosign download attestation \
          "${{ inputs.image_ref }}@${{ inputs.platform_digest }}" \
          > provenance.intoto.jsonl
        slsa-verifier verify-image \
          --provenance-path provenance.intoto.jsonl \
          --source-uri "github.com/${{ github.repository }}" \
          "${{ inputs.image_ref }}@${{ inputs.platform_digest }}"
        rm provenance.intoto.jsonl
